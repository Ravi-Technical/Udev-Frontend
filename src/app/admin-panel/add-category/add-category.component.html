<div class="container-wraper">
    <div class="container p-4">
        <div class="row">
            <div class="col-lg-6">
                <div class="form_wraper">
                    <form [formGroup]="addCategoryFrom">
                        <mat-card>
                            <h2 class="table-title">Add Category
                                <button id="addCat" *ngIf="isEditMode" mat-raised-button color="primary"
                                    (click)="updateCategory()"> Add Category </button>
                            </h2>
                            <mat-card-content>
                                <div class="form-grid">
                                    <!-- Category Name -->
                                    <mat-form-field appearance="outline">
                                        <mat-label>Category Name</mat-label>
                                        <input matInput formControlName="categoryName" placeholder="Enter category name"
                                            required>
                                        <mat-error *ngIf="catFormGet['categoryName'].errors?.['required']">Category is
                                            required.</mat-error>
                                    </mat-form-field>
                                </div>
                            </mat-card-content>
                            <mat-card-actions>
                                <button *ngIf="isEditMode" mat-raised-button color="primary" (click)="updateCategory()"
                                    [disabled]="addCategoryFrom.pristine || addCategoryFrom.value.categoryName === currentCategoryName"> Update Category </button>
                                <button *ngIf="!isEditMode" mat-raised-button color="primary" (click)="addCategory()"
                                    [disabled]="addCategoryFrom.invalid"> Save Category </button>
                                <button mat-button color="warn" type="reset">Reset</button>
                            </mat-card-actions>
                        </mat-card>
                    </form>
                </div>
            </div>
            <!---------------------------------------- List of category ------------------------------------------>
            <div class="col-lg-6">
                <div class="category-table-container mat-elevation-z4">
                    <h2 class="table-title">Category List</h2>
                    <h3 *ngIf="dataSource.data.length == 0">Data not available</h3>
                    <table *ngIf="dataSource.data.length > 0" mat-table [dataSource]="dataSource" matSort
                        class="mat-elevation-z2">
                        <!-- Index Column -->
                        <ng-container matColumnDef="index">
                            <th mat-header-cell *matHeaderCellDef>#</th>
                            <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
                        </ng-container>
                        <!-- Category Name Column -->
                        <ng-container matColumnDef="categoryName">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Category Name</th>
                            <td mat-cell *matCellDef="let element">{{ element.categoryName }}</td>
                        </ng-container>
                        <!-- Created Date Column -->
                        <ng-container matColumnDef="createdAt">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created At</th>
                            <td mat-cell *matCellDef="let element">
                                {{ element.timestamp | date: 'mediumDate' }}
                            </td>
                        </ng-container>
                        <!-- Actions Column -->
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef>Actions</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button matTooltip="Edit Category" (click)="onEdit(element)">
                                    <mat-icon>edit</mat-icon>
                                </button>

                                <button mat-icon-button matTooltip="Delete Category" (click)="onDelete(element)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>
                        <!-- Table Headers & Rows -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    </table>
                    <!-- Paginator -->
                    <!-- <ng-container *ngIf="dataSource.data.length > 0"> -->
                        <mat-paginator [pageSizeOptions]="[4, 8, 16]" showFirstLastButtons></mat-paginator>
                    <!-- </ng-container> -->
                </div>
            </div>
        </div>
    </div>
</div>
