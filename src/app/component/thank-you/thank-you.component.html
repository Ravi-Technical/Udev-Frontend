<div class="thankyou-wrapper">
  <mat-card class="thankyou-card">

    <!-- Success Icon -->
    <div class="success-icon">
      <mat-icon>check_circle</mat-icon>
    </div>

    <!-- Title -->
    <h1>Thank you for your purchase! 🎉</h1>
    <p class="subtitle">
      Your payment was successful and your course is now unlocked.
    </p>

    <!-- Order Summary -->
    <div class="summary">
      <div class="row">
        <span>Order ID</span>
        <strong>#ORD-2026-0012</strong>
      </div>
      <div class="row">
        <span>Amount Paid</span>
        <strong>₹ 56546</strong>
      </div>
      <div class="row">
        <span>Payment Method</span>
        <strong>Online</strong>
      </div>
    </div>

    <!-- CTA Buttons -->
    <div class="actions">
      <button mat-raised-button color="primary">
        Go to Dashboard
      </button>

      <button mat-stroked-button color="primary">
        Download Invoice
      </button>
    </div>

    <!-- Help -->
    <p class="help">
      Need help? <a href="/support">Contact Support</a>
    </p>

  </mat-card>
</div>
