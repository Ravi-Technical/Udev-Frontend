<div class="filter-dropdown">
    <!-- Clear All (Udemy style) -->
    <button mat-button [ngClass]="getCountActiveFilters ? 'active' : '' " class="filter-chip clear-all"
        (click)="clearAll()" matTooltip="Clear all filters">
        <mat-icon>filter_list</mat-icon>
        <span class="filter-label">All Clear</span>
        <span class="badge" *ngIf="getCountActiveFilters">{{getCountActiveFilters}}</span>
    </button>
    <!--------------------------------------------------- Filter Trigger Buttons ----------------------------------------------->
    <button [ngClass]="getCount('Level') ? 'active':'' " mat-button [matMenuTriggerFor]="levelMenu" class="filter-chip">
        <span class="filter-label">
            {{ getCount('Level') ? getLabel('Level') : 'Levels' }}
        </span>
        <span class="badge" *ngIf="getCount('Level')">
            {{ getCount('Level') }}
        </span>
    </button>
    <!-- Rating Button -->
    <button [ngClass]="getCount('Rating') ? 'active' : '' " mat-button [matMenuTriggerFor]="ratingMenu"
        class="filter-chip">
        <span class="filter-label">
            {{ getCount('Rating') ? getLabel('Rating') : 'Ratings' }}
        </span>
        <span class="badge" *ngIf="getCount('Rating')">
            {{ getCount('Rating') }}
        </span>
    </button>
    <!-- Language Button -->
    <button [ngClass]="getCount('Language') ? 'active' : '' " mat-button [matMenuTriggerFor]="languageMenu"
        class="filter-chip">
        <span class="filter-label">
            {{ getCount('Language') ? getLabel('Language') : 'Languages' }}
        </span>
        <span class="badge" *ngIf="getCount('Language')">
            {{ getCount('Language') }}
        </span>
    </button>
    <!------------------------------------------------ Filter Dropdowns ---------------------------------->
    <!-- Level Dropdown -->
    <mat-menu #levelMenu="matMenu" class="level-menu">
        <div class="menu-scroll">
            <mat-checkbox *ngFor="let level of levels" [checked]="selected.Level?.includes(level.Value)"
                (change)="toggleFilter(level.Type, level.Value, $event)">
                {{ level.Value }} <span class="count">({{ level.Count }})</span>
            </mat-checkbox>
        </div>
    </mat-menu>
    <!-- Rating Dropdown -->
    <mat-menu #ratingMenu="matMenu" class="level-menu">
        <div class="menu-scroll">
            <mat-checkbox *ngFor="let rating of ratings" [checked]="selected.Rating?.includes(rating.Value)"
                (change)="toggleFilter(rating.Type, rating.Value, $event)">
                {{ rating.Value }} & up <span class="count">({{ rating.Count }})</span>
            </mat-checkbox>
        </div>
    </mat-menu>
    <!-- Language Dropdown -->
     <mat-menu #languageMenu="matMenu" class="level-menu">
        <div class="menu-scroll">
            <mat-checkbox *ngFor="let lang of languages" [checked]="selected.Language?.includes(lang.Value)"
                (change)="toggleFilter(lang.Type, lang.Value, $event)">
                {{ lang.Value }} & up <span class="count">({{ lang.Count }})</span>
            </mat-checkbox>
        </div>
    </mat-menu>
</div> <!--- END MAIN WRAPER CLASS HERE ----->
