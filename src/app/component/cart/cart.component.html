<section class="addToCart">
    <div class="container">
        <div class="row" *ngIf="localProduct.length > 0">
            <div class="col-lg-8">
                <h3>Shopping Cart</h3>
                <div class="courseArea">
                    <h6 class="border-bottom">{{localProduct.length}} Course in Cart</h6>
                    <div class="row mb-2" *ngFor="let item of localProduct">
                          <div class="col-lg-8">
                              <div class="info-course">
                                 <img src="{{item.thumbnailImage}}" alt="{{item.title}}" />
                                 <h4>{{item.title}}</h4>
                                 <p>By {{item.instructors}}</p>
                                 <h6><mat-icon>star</mat-icon><span class="wraper">{{item.ratings}}</span></h6>
                              </div>
                          </div>
                          <div class="col-lg-4">
                            <ul class="courseRemoveArea">
                                <li><span class="remove" (click)="removeCourse(item.id)">Remove</span></li>
                                <li><span class="price">${{item.price}}</span></li>
                            </ul>
                          </div> 
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="checkoutArea">
                    <h3>Course Checkout</h3>
                    <ul>
                        <li>Total : <span class="price1"><b>${{totalPrice}}</b></span></li>
                    </ul>
                    <button class="checkout-btn" (click)="gotoCheckout()">
                        Proceed to Checkout <span class="arrow">→</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="row" *ngIf="localProduct.length == 0">
            <div class="col-lg-12 text-center">
                 <h4 class="mb-4">Your cart is empty. Keep shopping to find a course!</h4>
                 <button class="checkout-btn" (click)="gotoHome()">
                        Keep Shopping <span class="arrow">→</span>
                    </button>
            </div>
        </div>
    </div>
</section>
